- type: sourcePort
  id: NinjaScannerPort
  name: Инфо-сканер
  description: Порт для передачи данных и команд между консолью и сканером.

- type: sinkPort
  id: NinjaScannerPort
  name: Инфо-сканер
  description: Порт для передачи данных и команд между консолью и сканером.

- type: entity
  parent: BaseStructure
  id: NinjaInfoScanner
  name: сканнер разума
  description: Высокотехнологичная капсула для извлечения данных из живых субъектов.
  components:
  - type: NinjaInfoScanner
  - type: DeviceLinkSource
    ports:
    - NinjaScannerPort
  - type: Sprite
    sprite: _DeadSpace/Structures/Machines/ninja_scan.rsi
    layers:
    - state: icon_open
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 150
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Climbable

- type: entity
  parent: BaseStructure
  id: NinjaInfoConsole
  name: консоль сканера разума
  description: Терминал управления капсулой сканирования разума.
  components:
  - type: NinjaInfoConsole
  - type: DeviceLinkSink
    ports:
    - NinjaScannerPort
  - type: ActivatableUI
    key: enum.NinjaInfoScannerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NinjaInfoScannerUiKey.Key:
        type: NinjaInfoScannerBoundUserInterface
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - state: computer
    - state: request-sec
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 150
        mask:
        - MachineMask
        layer:
        - MachineLayer